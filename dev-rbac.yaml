apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: dev
  name: dev-developer-role
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "pods/log", "deployments", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
   name: dev-developer-binding
   namespace: dev
subjects:
  - kind: User
    name: dev-walter
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev-developer-role
  apiGroup: rbac.authorization.k8s.io


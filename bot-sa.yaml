apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot-sa
  namespace: dev

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: 
  namespace : dev
  name: deploy-bot-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-bot-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: deploy-bot-sa
    namespace: dev
roleRef:
  kind: Role
  name: deploy-bot-role
  apiGroup: rbac.authorization.k8s.io

